name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.email "ci@roletta.co.za"
          git config user.name  "Roletta CI"
          git remote add hf https://user:$HF_TOKEN@huggingface.co/spaces/rolettafolasade/greenhouse-dashboard
          git push hf main --force